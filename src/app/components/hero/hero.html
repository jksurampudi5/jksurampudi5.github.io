<section id="home" class="hero">
  <div class="hero-container">
    <div class="hero-content">
      
      <!-- Name with Gradient -->
      <h1 class="hero-name">
        <span class="first-name">Jayakrishna</span>
        <span class="last-name">Surampudi</span>
      </h1>

      <!-- Subtitle -->
      <h2 class="hero-role">Senior Data Engineer</h2>

      <!-- Bio / Description -->
      <p class="hero-description">
        I build scalable data pipelines and modern cloud infrastructure. 
        Specialized in Databricks, PySpark, and enterprise data solutions that drive business impact.
      </p>

      <!-- Action Buttons -->
      <div class="hero-buttons">
        <button (click)="scrollToSection('contact')" class="btn-connect">
          Connect Me
        </button>
        <button (click)="scrollToSection('projects')" class="btn-work">
          See My Work
        </button>
      </div>

    </div>

    <!-- Executive Professional Portrait Showcase -->
    <div class="hero-visual">
      <div class="executive-portrait-wrapper">
        
        <!-- Soft Ambient Atmosphere Glow -->
        <div class="portrait-ambient-glow"></div>

        <!-- Premium Modern Portrait Card -->
        <div class="portrait-card">
          <div class="portrait-canvas">
            <img 
              src="jayakrishna_profile_picture.png" 
              alt="Jayakrishna Surampudi - Senior Data Engineer" 
              class="portrait-img"
            />
          </div>
          <!-- Subtle Gradient Vignette to ground the bottom lapels -->
          <div class="portrait-vignette"></div>
        </div>

        <!-- Floating Executive Badge 1: Professional Status -->
        <div class="floating-badge badge-status">
          <span class="status-pulse-dot"></span>
          <span class="badge-text">Available for Senior Roles</span>
        </div>

        <!-- Floating Executive Badge 2: Experience & Domain -->
        <div class="floating-badge badge-experience">
          <div class="badge-icon-wrap">
            <span class="badge-icon">⚡</span>
          </div>
          <div class="badge-content">
            <span class="badge-headline">5+ Years Exp</span>
            <span class="badge-sub">Databricks & PySpark</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
