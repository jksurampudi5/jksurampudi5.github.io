<section id="home" class="hero">
  <div class="hero-container">
    <div class="hero-content">
      
      <!-- Name with Gradient -->
      <h1 class="hero-name">
        <span class="first-name">Jayakrishna</span>
        <span class="last-name">Surampudi</span>
      </h1>

      <!-- Subtitle -->
      <h2 class="hero-role">Senior Data Engineer</h2>

      <!-- Bio / Description -->
      <p class="hero-description">
        I build scalable data pipelines and modern cloud infrastructure. 
        Specialized in Databricks, PySpark, and enterprise data solutions that drive business impact.
      </p>

      <!-- Action Buttons -->
      <div class="hero-buttons">
        <button (click)="scrollToSection('contact')" class="btn-connect">
          Connect Me
        </button>
        <button (click)="scrollToSection('projects')" class="btn-work">
          See My Work
        </button>
      </div>

    </div>

    <!-- Profile Visual -->
    <div class="hero-visual">
      <div class="profile-card">
        <div class="profile-glow"></div>
        <img src="jayakrishna_profile_picture.png" alt="Jayakrishna Surampudi - Senior Data Engineer" />
      </div>
    </div>
  </div>
</section>
